<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="rps.css">
</head>
<body>
  <div id="header-placeholder"></div>
  <main>
    <section class="rps" aria-label="Rock Paper Scissors">
      <h1>Rock Paper Scissors</h1>
      <div class="button-group">
        <button class="choice" data-choice="Rock">Rock</button>
        <button class="choice" data-choice="Paper">Paper</button>
        <button class="choice" data-choice="Scissors">Scissors</button>
      </div>
      <div id="results" aria-live="polite">
        <p>You chose: <span id="user-choice"></span></p>
        <p>Computer chose: <span id="computer-choice"></span></p>
        <p>Result: <span id="result"></span></p>
      </div>
      <button id="play-again" hidden>Play Again</button>
      <div class="score">
        <span>Wins: <strong id="score-wins">0</strong></span>
        <span>Losses: <strong id="score-losses">0</strong></span>
        <span>Draws: <strong id="score-draws">0</strong></span>
      </div>
    </section>
  </main>
  <script src="header.js"></script>
  <script defer src="rps.js"></script>
</body>
</html>
